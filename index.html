<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dioses del mundo</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>DIOSES DEL MUNDO</h1>
    <h2>DESCUBRE HISTORIAS, ROMANCES, PROFECIAS...</h2>

    <button id="btnAleatorio" onclick="diosRandom()">Conoce a los dioses del mundo</button>

    <div id="galeria"></div>
    <div id="popup" class="oculto popup-overlay">
        <div class="popup-dioses">
            <button type="button" class="btn-close" id="cerrarPopup" aria-label="Close"></button>
            <h2 id="tituloDios" class="popup-titulo"></h2>
            <img id="imagenDios" class="popup-img" src="" alt="" style="width: 350px; height: 350px; border-radius: 10px;">
            <p id="textoDios" class="popup-texto"></p>
        </div>
    </div>

    <script src="js/script-dioses.js"></script>
    <script src="js/script-general.js"></script>
</body>
</html>
