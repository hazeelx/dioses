<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dioses del mundo</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="titulo">
        <h1 class="animate__animated animate__bounce">DIOSES DEL MUNDO</h1>
        <h2>DESCUBRE HISTORIAS, ROMANCES, PROFECIAS...</h2>
    </div>
    
    <button id="btnAleatorio" onclick="diosRandom()">
        <span>
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 0h24v24H0z" fill="none"></path>
                <path d="M24 12l-5.657 5.657-1.414-1.414L21.172 12l-4.243-4.243 1.414-1.414L24 12zM2.828 12l4.243 4.243-1.414 1.414L0 12l5.657-5.657L7.07 7.757 2.828 12zm6.96 9H7.66l6.552-18h2.128L9.788 21z"fill="currentColor"></path>
            </svg>Conoce a las deidades del mundo
        </span>
    </button>

    <div id="galeria"></div>
    <div id="popup" class="oculto popup-overlay">
        <div class="popup-dioses">
            <button type="button" class="btn-close" id="cerrarPopup" aria-label="Close"></button>
            <h2 id="tituloDios" class="popup-titulo"></h2>
            <img id="imagenDios" class="popup-img" src="" alt="" style="width: 350px; height: 350px; border-radius: 10px;">
            <p id="textoDios" class="popup-texto"></p>
        </div>
    </div>

    <script src="js/script-dioses.js"></script>
    <script src="js/script-general.js"></script>
</body>
</html>
